        // Phase 6
        { title: "Ironheart", year: "2025", type: "Series", phase: "Phase 6" },
        { title: "The Fantastic Four: First Steps", year: "2025", type: "Movie", phase: "Phase 6" },
        { title: "Wonder Man", year: "2025", type: "Series", phase: "Phase 6" },
        { title: "Avengers: Doomsday", year: "2026", type: "Movie", phase: "Phase 6" }
    ];

    const container = document.getElementById("list-container");

    let watchedItems =
        JSON.parse(localStorage.getItem("mcuWatchedItems")) || [];

    function saveStorage() {
        localStorage.setItem(
            "mcuWatchedItems",
            JSON.stringify(watchedItems)
        );
    }

    function updateProgress() {
        const total = mcuData.length;
        const completed = watchedItems.length;

        const percentage = total > 0
            ? Math.round((completed / total) * 100)
            : 0;

        document.getElementById("progress-text").textContent =
            `${completed} / ${total} (${percentage}%)`;

        document.getElementById("progress-bar").style.width =
            `${percentage}%`;
    }

    function toggleItem(title, cardElement) {
        if (watchedItems.includes(title)) {
            watchedItems = watchedItems.filter(
                item => item !== title
            );

            cardElement.classList.remove("watched");
        } else {
            watchedItems.push(title);
            cardElement.classList.add("watched");
        }

        saveStorage();
        updateProgress();
    }

    function renderList() {
        container.innerHTML = "";

        let currentPhase = "";

        mcuData.forEach(item => {

            // Create phase heading
            if (item.phase !== currentPhase) {
                currentPhase = item.phase;

                const divider = document.createElement("div");
                divider.className = "phase-divider";
                divider.textContent = currentPhase;

                container.appendChild(divider);
            }

            // Create item card
            const card = document.createElement("div");
            card.className = "item-card";

            if (watchedItems.includes(item.title)) {
                card.classList.add("watched");
            }

            card.innerHTML = `
                <div class="item-left">
                    <div class="checkbox-custom"></div>

                    <div class="info-block">
                        <span class="title">${item.title}</span>
                        <span class="meta">${item.year}</span>
                    </div>
                </div>

                <span class="badge badge-${item.type.toLowerCase()}">
                    ${item.type}
                </span>
            `;

            card.addEventListener("click", function () {
                toggleItem(item.title, card);
            });

            container.appendChild(card);
        });
    }

    renderList();
    updateProgress();
</script>
